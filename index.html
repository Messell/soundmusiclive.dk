<!DOCTYPE html>

<title>SoundMusic Live – Jørgen Messell</title>

<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;700&family=Space+Mono&display=swap">
<style>
:root{--bg:#0B1A24;--ink:#EAF5F2;--ink3:#9DB3BA;--acc:#3DD6C4}

.tag{display:block;margin-top:10px;font-family:"Space Mono",monospace;font-size:14px;letter-spacing:.5em;color:var(--ink3)}

</style>

<main>
